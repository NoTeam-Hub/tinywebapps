:root{
  --bg:#07080A; --ink:#ECE8DF; --mut:#8E918B; --dim:#5A5D58; --line:rgba(236,232,223,.12); --glass:rgba(16,18,20,.62);
  --acc:#FFB224; --acc-rgb:255,178,36;
  --serif:"Fraunces",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.fallbackbg{position:fixed;inset:0;z-index:-3;background:radial-gradient(60% 50% at 70% 20%,rgba(var(--acc-rgb),.18),transparent),var(--bg)}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(7,8,10,.15),rgba(7,8,10,.55))}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:14px clamp(16px,4vw,44px);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);background:linear-gradient(180deg,rgba(7,8,10,.75),rgba(7,8,10,.25));border-bottom:1px solid transparent}
.logo{display:flex;align-items:center;gap:10px;font:600 15px var(--sans);letter-spacing:.01em}
.logo svg{color:var(--acc);transition:color .5s}
.logo em{font:italic 500 17px var(--serif);color:var(--mut)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:99px;font-size:14px;color:var(--mut);transition:color .2s,background .2s}
.nav a svg{width:16px;height:16px}
.nav a:hover{color:var(--ink);background:rgba(236,232,223,.07)}
.nav a[aria-current=page]{color:var(--ink);background:rgba(236,232,223,.1);box-shadow:inset 0 0 0 1px var(--line)}
.kbtn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--mut);font-size:13px}
.kbtn kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:5px;background:rgba(236,232,223,.08);color:var(--ink)}
.kbtn:hover{color:var(--ink);border-color:rgba(236,232,223,.28)}

main:focus,main:focus-visible{outline:0}
main{width:min(1240px,100%);margin:0 auto;padding:0 clamp(16px,4vw,44px) 56px;outline:0;flex:1 0 auto}
.view{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* hero */
.hero{padding:clamp(56px,11vh,130px) 0 clamp(36px,6vh,70px)}
.kick{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:12px;transition:color .5s}
.kick::before{content:"";width:28px;height:1px;background:currentColor}
h1{font:400 clamp(44px,8.4vw,116px)/.96 var(--serif);letter-spacing:-.025em;margin:22px 0 26px;font-variation-settings:"opsz" 144}
h1 em{font-style:italic;color:var(--acc);transition:color .5s}
h1 .ln{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
h1 .ln>span{display:block;animation:up 1s var(--ease) both}
h1 .ln:nth-child(2)>span{animation-delay:.12s}
@keyframes up{from{transform:translateY(105%)}to{transform:none}}
.lede{max-width:560px;color:var(--mut);font-size:clamp(16px,1.6vw,19px)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:99px;font-weight:600;font-size:15px;transition:transform .25s var(--ease),background .25s,box-shadow .25s}
.btn.pri{background:var(--acc);color:#14100A;box-shadow:0 10px 40px -10px rgba(var(--acc-rgb),.7)}
.btn.pri:hover{transform:translateY(-2px)}
.btn.sec{border:1px solid var(--line);background:rgba(236,232,223,.04)}
.btn.sec:hover{background:rgba(236,232,223,.1)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}

/* ticker */
.tick{overflow:hidden;border-block:1px solid var(--line);margin:18px 0 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tick div{display:flex;gap:44px;width:max-content;padding:14px 0;animation:tick 38s linear infinite;font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tick span::after{content:"✦";margin-left:44px;color:var(--acc)}
@keyframes tick{to{transform:translateX(-50%)}}

/* cards */
.stack{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:clamp(40px,7vh,80px)}
.card{--c:var(--acc-rgb);position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:320px;padding:26px;border-radius:26px;background:var(--glass);border:1px solid var(--line);overflow:hidden;isolation:isolate;
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s var(--ease),border-color .3s;will-change:transform}
.card:nth-child(1){grid-column:span 7}.card:nth-child(2){grid-column:span 5}.card:nth-child(3){grid-column:span 5}.card:nth-child(4){grid-column:span 7}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(var(--c),.22),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover{border-color:rgba(var(--c),.55)}
.card:hover::before{opacity:1}
.card .num{font:500 12px var(--mono);color:var(--dim);letter-spacing:.14em}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .mk{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:rgb(var(--c));background:rgba(var(--c),.1);box-shadow:inset 0 0 0 1px rgba(var(--c),.3)}
.card .mk svg{width:30px;height:30px}
.card h3{font:400 clamp(30px,3.6vw,46px)/1 var(--serif);letter-spacing:-.02em;margin:46px 0 10px}
.card h3 em{color:rgb(var(--c))}
.card p{color:var(--mut);max-width:44ch;font-size:15.5px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:500 11px var(--mono);letter-spacing:.06em;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.go{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:background .3s,transform .4s var(--ease),color .3s}
.card:hover .go{background:rgb(var(--c));color:#0B0C0D;transform:rotate(-45deg)}
.card .status{position:absolute;right:26px;top:90px;font:500 11px var(--mono);letter-spacing:.1em;color:var(--dim)}

/* principles */
.pr{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:70px;border:1px solid var(--line);border-radius:22px;background:var(--glass);overflow:hidden}
.pr div{padding:26px;border-right:1px solid var(--line)}.pr div:last-child{border:0}
.pr b{display:block;font:400 26px var(--serif);margin-bottom:6px}
.pr span{color:var(--mut);font-size:14.5px}

/* detail */
.det{padding-top:clamp(28px,6vh,64px)}
.crumb{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;gap:10px;align-items:center}
.crumb a:hover{color:var(--ink)}
.dh{display:flex;gap:22px;align-items:center;margin:26px 0 16px}
.dh .mk{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;color:var(--acc);background:rgba(var(--acc-rgb),.1);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.35);flex:none}
.dh .mk svg{width:40px;height:40px}
.det h1{margin:0;font-size:clamp(46px,9vw,120px)}
.tagl{font:italic 400 clamp(20px,2.6vw,30px)/1.25 var(--serif);color:var(--ink);max-width:30ch;margin-top:8px}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,3vw,44px);margin-top:42px;align-items:start}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0}
.fact{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--glass)}
.fact small{display:block;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;transition:color .5s}
.fact span{font-size:14.5px;color:var(--ink)}
.how h2,.note h2{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:30px 0 12px}
.how ol{list-style:none;counter-reset:s;display:grid;gap:10px}
.how li{counter-increment:s;display:flex;gap:14px;color:var(--mut)}
.how li::before{content:counter(s,decimal-leading-zero);font:500 12px var(--mono);color:var(--acc);padding-top:4px}
.note p{color:var(--mut);font-size:14.5px;padding-left:14px;border-left:2px solid rgba(var(--acc-rgb),.5)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:70px;border-top:1px solid var(--line);padding-top:26px}
.pn a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:14px;transition:background .2s}
.pn a:hover{background:rgba(236,232,223,.06)}
.pn small{font:500 11px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.pn b{font:400 24px var(--serif)}
.pn a:last-child{text-align:right}

/* device stage */
.dev{position:sticky;top:84px;border-radius:20px;border:1px solid var(--line);background:#0C0D0F;overflow:hidden;box-shadow:0 40px 120px -40px rgba(var(--acc-rgb),.45),0 0 0 1px rgba(0,0,0,.4)}
.chrome{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);background:#121416}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#2A2D30}
.url{flex:1;min-width:0;font:500 12px var(--mono);color:var(--mut);padding:6px 12px;border-radius:8px;background:#0A0B0C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome a,.chrome button{font:500 12px var(--mono);color:var(--mut);padding:6px 9px;border-radius:8px}
.chrome a:hover,.chrome button:hover{color:var(--ink);background:rgba(236,232,223,.08)}
.screen{position:relative;aspect-ratio:4/3.3;min-height:420px;background:#0A0B0C}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.launch{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:radial-gradient(70% 70% at 50% 40%,rgba(var(--acc-rgb),.16),transparent)}
.launch .mk{width:84px;height:84px;color:var(--acc);display:grid;place-items:center;border-radius:24px;box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.35);background:rgba(var(--acc-rgb),.08);animation:float 5s ease-in-out infinite}
.launch .mk svg{width:44px;height:44px}
@keyframes float{50%{transform:translateY(-8px)}}
.launch p{color:var(--mut);width:min(34ch,100%);font-size:14.5px;text-wrap:balance}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--mono);letter-spacing:.12em;color:var(--mut);pointer-events:none;text-transform:uppercase}
.slow{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 14px;border-radius:12px;background:rgba(10,11,12,.92);border:1px solid var(--line);font-size:13px;color:var(--mut);display:flex;gap:10px;justify-content:space-between;align-items:center}
.slow a{color:var(--acc);font-weight:600;white-space:nowrap}

/* footer */
footer{border-top:1px solid var(--line);padding:24px clamp(16px,4vw,44px) 28px;width:100%;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;color:var(--dim);font-size:13px;max-width:1240px;margin:0 auto}
footer a:hover{color:var(--ink)}
.copy a{color:var(--mut);text-decoration:underline;text-decoration-color:rgba(var(--acc-rgb),.6);text-underline-offset:3px}
.copy a:hover{color:var(--acc)}

/* palette */
dialog{margin:12vh auto auto;width:min(560px,92vw);padding:0;border:1px solid var(--line);border-radius:18px;background:#101214;color:var(--ink);box-shadow:0 40px 120px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(5,6,7,.7);backdrop-filter:blur(6px)}
dialog input{width:100%;padding:18px 20px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:400 17px var(--sans);outline:0}
dialog ul{list-style:none;padding:8px;max-height:48vh;overflow:auto}
dialog li button{width:100%;display:flex;align-items:center;gap:14px;padding:12px;border-radius:10px;text-align:left}
dialog li button svg{width:20px;height:20px;color:var(--acc)}
dialog li button small{margin-left:auto;font:500 11px var(--mono);color:var(--dim)}
dialog li[aria-selected=true] button{background:rgba(236,232,223,.09)}

/* mobile dock */
.dock{display:none}
@media(max-width:900px){
  .nav,.kbtn kbd,.kbtn span,.cta kbd{display:none}
  footer{padding-bottom:104px}.kbtn{margin-left:auto;padding:10px}
  .card:nth-child(n){grid-column:span 12;min-height:280px}
  .pr{grid-template-columns:1fr 1fr}.pr div:nth-child(2){border-right:0}.pr div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .dgrid{grid-template-columns:1fr}.dev{position:relative;top:0;order:-1}.screen{min-height:380px}
  .dock{display:flex;position:fixed;z-index:30;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);gap:4px;padding:6px;border-radius:99px;background:rgba(16,18,20,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 14px 50px rgba(0,0,0,.6)}
  .dock a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
  .dock a svg{width:22px;height:22px}
  .dock a[aria-current=page]{background:var(--acc);color:#14100A}
}
@media(max-width:520px){.facts{grid-template-columns:1fr}.dh{gap:14px}.dh .mk{width:56px;height:56px;border-radius:16px}.dh .mk svg{width:30px;height:30px}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .card{transform:none!important}
}
</style>
</head>
<body>
<div class="fallbackbg"></div>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="veil"></div>

<header class="bar">
  <a class="logo" href="#/" aria-label="Tiny Web Apps, home">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5h9v9H5zM18 5h9v9h-9zM5 18h9v9H5z"/><path d="M18 22.5h9M22.5 18v9"/></svg>
    tinywebapps<em>.in</em>
  </a>
  <nav class="nav" id="nav" aria-label="Tools"></nav>
  <button class="kbtn" id="kOpen" type="button" aria-label="Open the quick switcher"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/></svg><span>Jump to…</span><kbd>Ctrl K</kbd></button>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <span><a href="https://tinywebapps.in/">tinywebapps.in</a> · Free tools. No sign-up. Your files stay on your device.</span>
  <span class="copy">&copy; <span id="yr">2026</span> <a href="https://www.instagram.com/ashish.narayann/" target="_blank" rel="noopener noreferrer">@ashish.narayann</a>. All rights reserved.</span>
  <span><a href="#/clearcut">Clearcut</a> · <a href="#/verbatim">Verbatim</a> · <a href="#/stillreel">Stillreel</a> · <a href="#/tailorly">The Tailorly</a></span>
</footer>
<nav class="dock" id="dock" aria-label="Tools (mobile)"></nav>

<dialog id="pal" aria-label="Quick switcher">
  <input id="palQ" type="text" placeholder="Jump to a tool…" autocomplete="off" spellcheck="false" aria-label="Search tools">
  <ul id="palL" role="listbox"></ul>
</dialog>

<script>
(() => {
"use strict";
/* ============ TOOL ADDRESSES ============
   Each tool lives in its own folder on this domain: /clearcut/, /verbatim/, /stillreel/, /tailorly/.
   Use a full https:// address here instead if you ever host one elsewhere. Leave "" to show "not linked yet". */
const TOOLS = [
  { id:"clearcut", name:"Clearcut", url:"clearcut/", rgb:"232,84,60", hex:"#E8543C",
    kick:"Images", tag:"Lift any subject out of its background.",
    desc:"Remove the background from a photo and keep every hair and edge. The cut-out is made on your device, then refined with a precision brush.",
    chips:["Photos","PNG export","Precision brush"],
    facts:[["Does","Background removal"],["Input","JPG, PNG, WebP"],["Output","Transparent PNG"],["Cost","Free, no limits"]],
    steps:["Drop in a photo.","Wait a moment while it cuts out the subject.","Refine edges with the brush, then download."],
    note:"Fine hair and glass can need a small touch-up. The first run loads the model, so give it a moment.",
    vb:26, sw:1.6, mark:'<circle cx="13" cy="13" r="6.5"/><path d="M13 1v8M13 17v8M1 13h8M17 13h8"/>' },
  { id:"verbatim", name:"Verbatim", url:"verbatim/", rgb:"84,140,255", hex:"#548CFF",
    kick:"Speech", tag:"Every word of your audio, written down.",
    desc:"Turn recordings and voice notes into text with a Whisper speech model that runs inside your browser. Your audio is never sent to a server.",
    chips:["Whisper","Audio to text","Offline-ready"],
    facts:[["Does","Speech to text"],["Input","Audio and video files"],["Output","Text you can copy"],["Cost","Free, no limits"]],
    steps:["Add an audio or video file.","The model listens on your device.","Copy or download the transcript."],
    note:"The first run downloads the speech model once. After that it loads from your browser cache.",
    sw:3, mark:'<path d="M5 13v6M10.5 8v16M16 4v24M21.5 9v14M27 13v6"/>' },
  { id:"stillreel", name:"Stillreel", url:"stillreel/", rgb:"255,178,36", hex:"#FFB224",
    kick:"Video", tag:"Stories from stills. Photos and words in motion.",
    desc:"Build a video from your photos and your words: 3D depth, text scenes, music and a long runtime. Export straight from the browser.",
    chips:["Photos to video","3D depth","MP4 / WebM"],
    facts:[["Does","Photo and text to video"],["Input","Photos, words, music"],["Output","H.264 or VP9 video"],["Cost","Free, no watermark"]],
    steps:["Add photos and write your text scenes.","Pick depth, pacing and music.","Export the finished video."],
    note:"Export speed depends on your device. For long videos, use a desktop browser.",
    sw:2.4, mark:'<circle cx="16" cy="16" r="12.5"/><g fill="currentColor" stroke="none"><circle cx="16" cy="9" r="2.1"/><circle cx="22.1" cy="19.5" r="2.1"/><circle cx="9.9" cy="19.5" r="2.1"/><circle cx="16" cy="16" r="1.6"/></g>' },
  { id:"tailorly", name:"The Tailorly", url:"tailorly/", rgb:"58,176,124", hex:"#3AB07C",
    kick:"Resumes", tag:"One resume. Tailored to every job.",
    desc:"Paste your resume and a job post. Get a match score, the keywords you are missing and sharper bullet points, right beside your text.",
    chips:["Match score","Keywords","PDF and DOCX"],
    facts:[["Does","Resume tailoring"],["Input","Paste, PDF, DOCX"],["Output","Edited DOCX or text"],["Cost","Free, nothing uploaded"]],
    steps:["Paste your resume and the job post.","Tick the keywords that are true for you.","Apply the rewrites and export."],
    note:"It checks wording and keywords, not how good your experience is. Scanned PDFs cannot be read. Keep every line true.",
    mark:'<path d="M8 3.5h11l6 6v19H8z"/><path d="M19 3.5v6h6"/><path d="M12 15h8" stroke-dasharray="2.6 2.8"/><path d="M12 19.5h8" stroke-dasharray="2.6 2.8"/><path d="M12 24h5" stroke-width="2.75"/>' }
];
const svg = (t, s) => `<svg viewBox="0 0 ${t.vb||32} ${t.vb||32}" fill="none" stroke="currentColor" stroke-width="${t.sw||2.2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${s?` width="${s}" height="${s}"`:""}>${t.mark}</svg>`;
const ARROW = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const host = u => { try { const x = new URL(u, "https://tinywebapps.in/"); return x.host + x.pathname } catch { return "" } };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const root = document.documentElement;

/* ---------- accent ---------- */
let cur = [255,178,36], target = [255,178,36];
function setAccent(rgb){
  target = rgb.split(",").map(Number);
  root.style.setProperty("--acc-rgb", rgb);
  root.style.setProperty("--acc", `rgb(${rgb})`);
}

/* ---------- nav + dock ---------- */
$("#nav").innerHTML = TOOLS.map(t => `<a href="#/${t.id}" data-id="${t.id}">${svg(t)}${esc(t.name)}</a>`).join("");
$("#dock").innerHTML = TOOLS.map(t => `<a href="#/${t.id}" data-id="${t.id}" aria-label="${esc(t.name)}">${svg(t)}</a>`).join("");
function markNav(id){
  document.querySelectorAll("#nav a,#dock a").forEach(a => a.dataset.id === id ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}

/* ---------- views ---------- */
function home(){
  setAccent("255,178,36");
  const words = ["Image","Speech","Video","Resume","Private","Free","No sign-up","In your browser"];
  const tick = words.concat(words).map(w => `<span>${w}</span>`).join("");
  return `<section class="view hero">
    <p class="kick">Four tools · one tiny home</p>
    <h1><span class="ln"><span>Tiny tools.</span></span><span class="ln"><span><em>Nothing</em> leaves</span></span><span class="ln"><span>your device.</span></span></h1>
    <p class="lede">Cut out a background, transcribe a recording, turn photos into a film, tailor a resume. Each one runs in your browser. No account, no uploads, no price tag.</p>
    <div class="cta"><a class="btn pri" href="#stack">Pick a tool ${ARROW}</a><button class="btn sec" type="button" data-pal>Quick switcher <kbd style="font:500 11px var(--mono);opacity:.7">Ctrl K</kbd></button></div>
    <div class="tick" aria-hidden="true"><div>${tick}</div></div>
  </section>
  <section class="view stack" id="stack" aria-label="Tools">
    ${TOOLS.map((t,i) => `<a class="card" href="#/${t.id}" style="--c:${t.rgb}" data-tilt>
      <div class="top"><span class="mk">${svg(t)}</span><span class="num">0${i+1} / ${esc(t.kick.toUpperCase())}</span></div>
      <div><h3>${esc(t.name)}</h3><p>${esc(t.tag)} ${esc(t.desc.split(". ")[0])}.</p></div>
      <div class="foot"><div class="chips">${t.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div><span class="go">${ARROW}</span></div>
    </a>`).join("")}
  </section>
  <section class="view pr" aria-label="Principles">
    <div><b>Free</b><span>No trial, no paywall, no watermark.</span></div>
    <div><b>Private</b><span>Files are processed on your device, not uploaded.</span></div>
    <div><b>No sign-up</b><span>Open a tool and start. No account, no email.</span></div>
    <div><b>Lightweight</b><span>Plain web pages. They work on a laptop or a phone.</span></div>
  </section>`;
}

function detail(t, i){
  setAccent(t.rgb);
  const prev = TOOLS[(i + TOOLS.length - 1) % TOOLS.length], next = TOOLS[(i + 1) % TOOLS.length];
  const linked = !!t.url;
  const open = linked ? `<a class="btn pri" href="${esc(t.url)}" target="_blank" rel="noopener">Open ${esc(t.name)} ${ARROW}</a>`
                      : `<span class="btn pri" aria-disabled="true">Not linked yet</span>`;
  return `<article class="view det">
    <p class="crumb"><a href="#/">Hub</a><span>/</span><span>${esc(t.kick)}</span></p>
    <div class="dh"><span class="mk">${svg(t)}</span><h1>${esc(t.name)}</h1></div>
    <p class="tagl">${esc(t.tag)}</p>
    <div class="dgrid">
      <div>
        <p class="lede">${esc(t.desc)}</p>
        <div class="cta">${open}${linked ? `<button class="btn sec" type="button" data-launch>Try it here</button>` : ""}</div>
        <div class="facts">${t.facts.map(f => `<div class="fact"><small>${esc(f[0])}</small><span>${esc(f[1])}</span></div>`).join("")}</div>
        <div class="how"><h2>How it works</h2><ol>${t.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
        <div class="note"><h2>Good to know</h2><p>${esc(t.note)}</p></div>
      </div>
      <div class="dev" id="dev">
        <div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url">${linked ? esc(host(t.url)) : "address not set"}</span>${linked ? `<a href="${esc(t.url)}" target="_blank" rel="noopener" aria-label="Open in a new tab">Open ↗</a><button type="button" data-reload aria-label="Reload" hidden>↻</button>` : ""}</div>
        <div class="screen" id="screen">
          <div class="launch"><span class="mk">${svg(t)}</span>
            ${linked ? `<p>Run ${esc(t.name)} right here. It loads only when you press the button.</p><button class="btn pri" type="button" data-launch>Launch ${esc(t.name)}</button>`
                     : `<p>This tool has no address yet. Set its link at the top of the page script and it will appear here.</p>`}
          </div>
        </div>
      </div>
    </div>
    <div class="pn"><a href="#/${prev.id}"><small>Previous</small><b>${esc(prev.name)}</b></a><a href="#/${next.id}"><small>Next</small><b>${esc(next.name)}</b></a></div>
  </article>`;
}

function launch(t){
  const sc = $("#screen"); if (!sc || !t.url) return;
  sc.innerHTML = `<div class="loading" id="ld">Loading ${esc(t.name)}…</div>
    <iframe title="${esc(t.name)}" src="${esc(t.url)}" allow="clipboard-write; fullscreen; microphone; autoplay" referrerpolicy="no-referrer" loading="eager"></iframe>`;
  const fr = $("iframe", sc), rl = $("[data-reload]");
  if (rl) rl.hidden = false;
  let done = false;
  fr.addEventListener("load", () => { done = true; $("#ld")?.remove(); $(".slow", sc)?.remove(); });
  setTimeout(() => {
    if (!done && $("#screen") === sc) sc.insertAdjacentHTML("beforeend", `<div class="slow"><span>Taking a while? You can open it in its own tab.</span><a href="${esc(t.url)}" target="_blank" rel="noopener">Open in a new tab ↗</a></div>`);
  }, 9000);
}

/* ---------- router ---------- */
let route = null;
function parse(){ const m = location.hash.match(/^#\/([a-z]*)/); return m ? m[1] : ""; }
function render(){
  const id = parse(), i = TOOLS.findIndex(t => t.id === id), t = TOOLS[i];
  const key = t ? id : "";
  if (key === route) return;
  route = key;
  const app = $("#app");
  const paint = () => {
    app.innerHTML = t ? detail(t, i) : home();
    markNav(t ? id : "");
    document.title = t ? `${t.name}: ${t.tag} | Tiny Web Apps` : "Tiny Web Apps: free, private tools that run in your browser";
    scrollTo({ top: 0, behavior: "instant" });
    app.focus({ preventScroll: true });
    bindTilt();
  };
  if (document.startViewTransition && !reduce) document.startViewTransition(paint); else paint();
}
addEventListener("hashchange", render);

document.addEventListener("click", e => {
  const l = e.target.closest("[data-launch]");
  if (l) { launch(TOOLS.find(t => t.id === route)); return; }
  const r = e.target.closest("[data-reload]");
  if (r) { launch(TOOLS.find(t => t.id === route)); return; }
  if (e.target.closest("[data-pal]")) openPal();
  const a = e.target.closest('a[href="#stack"]');
  if (a) { e.preventDefault(); $("#stack")?.scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); }
});

/* ---------- card tilt + spotlight ---------- */
function bindTilt(){
  if (reduce) return;
  document.querySelectorAll("[data-tilt]").forEach(c => {
    c.addEventListener("pointermove", e => {
      if (e.pointerType === "touch") return;
      const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      c.style.setProperty("--mx", x * 100 + "%"); c.style.setProperty("--my", y * 100 + "%");
      c.style.setProperty("--ry", (x - .5) * 7 + "deg"); c.style.setProperty("--rx", (.5 - y) * 7 + "deg");
    });
    c.addEventListener("pointerleave", () => { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); });
    c.addEventListener("pointerenter", () => { const rgb = c.style.getPropertyValue("--c"); if (rgb) target = rgb.split(",").map(Number); });
  });
  const st = $("#stack"); if (st) st.addEventListener("pointerleave", () => { target = [255,178,36]; });
}

/* ---------- quick switcher ---------- */
const pal = $("#pal"), palQ = $("#palQ"), palL = $("#palL");
let items = [], sel = 0;
function fillPal(){
  const q = palQ.value.trim().toLowerCase();
  items = [{ id:"", name:"Hub home", s:"Home", mark:null }].concat(TOOLS.map(t => ({ id:t.id, name:t.name, s:t.kick, mark:t })))
    .filter(x => !q || (x.name + " " + x.s).toLowerCase().includes(q));
  sel = Math.min(sel, Math.max(items.length - 1, 0));
  palL.innerHTML = items.map((x, i) => `<li role="option" aria-selected="${i === sel}"><button type="button" data-i="${i}">${x.mark ? svg(x.mark) : '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l7-6 7 6v8H3z"/></svg>'}${esc(x.name)}<small>${esc(x.s)}</small></button></li>`).join("") || '<li style="padding:14px;color:var(--mut)">No match.</li>';
}
function openPal(){ palQ.value = ""; sel = 0; fillPal(); if (!pal.open) pal.showModal(); palQ.focus(); }
function go(i){ const x = items[i]; if (!x) return; pal.close(); location.hash = x.id ? "#/" + x.id : "#/"; }
$("#kOpen").addEventListener("click", openPal);
palQ.addEventListener("input", () => { sel = 0; fillPal(); });
palL.addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) go(+b.dataset.i); });
pal.addEventListener("click", e => { if (e.target === pal) pal.close(); });
palQ.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % items.length; fillPal(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel + items.length - 1) % items.length; fillPal(); }
  else if (e.key === "Enter") { e.preventDefault(); go(sel); }
});
addEventListener("keydown", e => {
  const typing = /input|textarea|select/i.test(document.activeElement?.tagName || "");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.open ? pal.close() : openPal(); return; }
  if (typing || pal.open || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); openPal(); }
  else if (/^[1-4]$/.test(e.key)) location.hash = "#/" + TOOLS[+e.key - 1].id;
  else if (e.key === "0" || e.key === "h") location.hash = "#/";
});

/* ---------- WebGL aurora ---------- */
(function gl(){
  const cv = $("#gl"), g = cv.getContext("webgl", { antialias:false, alpha:false, powerPreference:"low-power" });
  if (!g) return;
  document.querySelector(".fallbackbg").style.opacity = ".0";
  const vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  const fs = `precision mediump float;uniform vec2 r;uniform float t;uniform vec3 a;uniform vec2 m;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,s=.5;for(int i=0;i<4;i++){v+=s*n(p);p=p*2.03+7.;s*=.5;}return v;}
  void main(){
    vec2 uv=gl_FragCoord.xy/r; vec2 p=(gl_FragCoord.xy-.5*r)/r.y;
    vec2 q=vec2(fbm(p*1.6+t*.05),fbm(p*1.6+5.2-t*.04));
    float f=fbm(p*1.4+2.*q+t*.03);
    float d=length((uv-m)*vec2(r.x/r.y,1.));
    vec3 col=vec3(.027,.031,.039)+a*(pow(f,2.6)*.5+.22*exp(-d*3.4));
    col*=1.-.6*length(uv-.5);
    col+=(h(gl_FragCoord.xy+t)-.5)*.018;
    gl_FragColor=vec4(col,1.);}`;
  const mk = (ty, s) => { const o = g.createShader(ty); g.shaderSource(o, s); g.compileShader(o); return o; };
  const pr = g.createProgram(); g.attachShader(pr, mk(g.VERTEX_SHADER, vs)); g.attachShader(pr, mk(g.FRAGMENT_SHADER, fs)); g.linkProgram(pr);
  if (!g.getProgramParameter(pr, g.LINK_STATUS)) { document.querySelector(".fallbackbg").style.opacity = "1"; return; }
  g.useProgram(pr);
  const b = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER, b); g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(pr, "p"); g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
  const U = n => g.getUniformLocation(pr, n), ur = U("r"), ut = U("t"), ua = U("a"), um = U("m");
  const S = .55; let mx = .7, my = .8, tx = .7, ty = .8, T0 = performance.now(), run = true, raf = 0;
  function size(){ cv.width = Math.max(2, innerWidth * S | 0); cv.height = Math.max(2, innerHeight * S | 0); g.viewport(0, 0, cv.width, cv.height); }
  addEventListener("resize", size); size();
  addEventListener("pointermove", e => { tx = e.clientX / innerWidth; ty = 1 - e.clientY / innerHeight; }, { passive:true });
  function frame(now){
    for (let i = 0; i < 3; i++) cur[i] += (target[i] - cur[i]) * .06;
    mx += (tx - mx) * .05; my += (ty - my) * .05;
    g.uniform2f(ur, cv.width, cv.height); g.uniform1f(ut, reduce ? 12 : (now - T0) / 1000);
    g.uniform3f(ua, cur[0] / 255 * .55, cur[1] / 255 * .55, cur[2] / 255 * .55); g.uniform2f(um, mx, my);
    g.drawArrays(g.TRIANGLES, 0, 3);
    if (run && !reduce) raf = requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", () => { run = !document.hidden; if (run && !reduce) { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); } });
  raf = requestAnimationFrame(frame);
  if (reduce) setInterval(() => frame(0), 120);
})();

$("#yr").textContent = new Date().getFullYear();
render();
})();
</script>
